name: ai_knowledge_inbox

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge_inbox_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_PATH=inbox.db
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    restart: unless-stopped
